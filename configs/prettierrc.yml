arrowParens: always
bracketSameLine: true
bracketSpacing: true
embeddedLanguageFormatting: off
endOfLine: lf
plugins:
  - "prettier-plugin-gherkin"
printWidth: 120
proseWrap: preserve
quoteProps: as-needed
semi: true
singleAttributePerLine: true
singleQuote: false
tabWidth: 2
trailingComma: none
useTabs: false
