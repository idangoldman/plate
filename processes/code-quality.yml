processes:
  format:
    namespace: code_quality
    description: "Check formatting for coffee, css, scss files"
    availability:
      restart: "no"
    command: |
      ${PLATE_BIN_PATH}/prettier \
        --check \
        --config ${PLATE_CONF_PATH}/prettierrc.yml \
        --ignore-path ${PLATE_CONF_PATH}/.prettierignore \
        "${PLATE_PRJ_PATH}/**/*.{coffee,css,scss}"

  format-fix:
    namespace: code_quality
    description: "Automatically fix formatting issues in supported files"
    availability:
      restart: "no"
    command: |
      ${PLATE_BIN_PATH}/prettier \
        --write \
        --config ${PLATE_CONF_PATH}/prettierrc.yml \
        --ignore-path ${PLATE_PKG_PATH}/.prettierignore \
        "${PLATE_PRJ_PATH}/**/*.{coffee,css,scss}"

  lint:
    namespace: code_quality
    description: "Check linting for CoffeeScript files"
    availability:
      restart: "no"
    command: |
      set --local coffeelint_json_tmp (mktemp)
      set --local coffeelint_files (find ${PLATE_PRJ_PATH}/{source,lib,tests} -name "*.coffee" -type f)

      yq -o=json ${PLATE_CONF_PATH}/coffeelint.yml > $$coffeelint_json_tmp

      ${PLATE_BIN_PATH}/coffeelint \
        --file $$coffeelint_json_tmp \
        $$coffeelint_files

      rm -frv $$coffeelint_json_tmp
