name: Build and Test

on:
  workflow_dispatch:

  push:
    paths:
      - "library/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PLATE_ENV: test-ci
      PLATE_PKG_PATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v6.0.1

      - name: Setup yq
        uses: mikefarah/yq@v4.49.2

      - name: Setup Taskfile
        uses: arduino/setup-task@v2.0.0
        with:
          version: 3.x

      - name: Setup PNPM
        uses: pnpm/action-setup@v4.2.0
        with:
          version: latest
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: task --taskfile ./tasks tests:run
