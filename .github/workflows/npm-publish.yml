name: Publish Package to NPM
on:
  workflow_dispatch:

  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      PLATE_ENV: publish-ci
      PLATE_PKG_PATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v6.0.1

      - name: Setup yq
        uses: mikefarah/yq@v4.49.2

      - name: Setup Taskfile
        uses: arduino/setup-task@v2.0.0
        with:
          version: 3.x

      - name: Setup PNPM
        uses: pnpm/action-setup@v4.2.0
        with:
          version: latest
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Plate CLI
        run: task --taskfile ./tasks transpile:library

      - name: Publish to NPM
        run: pnpm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
