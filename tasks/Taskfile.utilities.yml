version: "3"

tasks:
  clean:
    desc: "Remove files via a targeted clean-up of files or directories"
    vars:
      TARGET: '{{.TARGET | default "tmp"}}'
    cmds:
      - task: validate-target
        vars:
          TARGET: "{{.TARGET}}"

      - rm -frv {{.PLATE_PKG_PATH}}/{{.TARGET}}

  create-directory:
    desc: "Create a directory"
    internal: true
    requires:
      vars: [TARGET]
    cmds:
      - task: validate-target
        vars:
          TARGET: "{{.TARGET}}"

      - mkdir -p "$(dirname {{.PLATE_PKG_PATH}}/{{.TARGET}})"

  yaml-to-json:
    desc: "Convert YAML file to JSON"
    internal: true
    requires:
      vars: [SOURCE, TARGET]
    sources:
      - "{{.PLATE_PKG_PATH}}/{{.SOURCE}}"
    generates:
      - "{{.PLATE_PKG_PATH}}/{{.TARGET}}"
    cmds:
      - task: create-directory
        vars:
          TARGET: "{{.TARGET}}"
      - |
        yq \
          --output-format=json \
          --prettyPrint \
          --yaml-fix-merge-anchor-to-spec \
          {{.PLATE_PKG_PATH}}/{{.SOURCE}} > {{.PLATE_PKG_PATH}}/{{.TARGET}}

  validate-target:
    desc: "Validate TARGET variable doesn't contain relative path components"
    internal: true
    requires:
      vars: [TARGET]
    preconditions:
      - sh: '[ -z "$(echo "{{.TARGET}}" | grep -E "^\\/|\\.\\./|\\.\\.")" ]'
        msg: "TARGET must be a relative path without ../ components or absolute paths"
    cmd: echo "TARGET validation passed{{":"}} {{.TARGET}}"
